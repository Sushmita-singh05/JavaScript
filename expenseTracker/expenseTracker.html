<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="expenseTracker.css">
</head>
<body>

    <h1>Expense Tracker</h1>

    <h2>Total Expenses: ₹<span id="totalExpenses">0</span></h2>

    <input type="text" id="expenseItem" placeholder="Enter expense item">

    <input type="number" id="expenseAmount" placeholder="Enter expense amount">

    <select id="expenseCategory">
        <option value="food">Food</option>
        <option value="transportation">Transportation</option>
        <option value="entertainment">Entertainment</option>
        <option value="utilities">Utilities</option>
    </select>

    <button id="addExpenseBtn">Add Expense</button>

    <ul id="expenseList"></ul>

    <script src="expenseTracker.js"></script>

</body>
</html>
